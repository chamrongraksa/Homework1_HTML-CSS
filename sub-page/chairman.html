* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
}

body {
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* OUTER LAYOUT — COLUMN FLEXBOX */
.layout {
    height: 100vh;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header {
  background: #2f8efb;
  padding: 30px;
  color: white;
  font-size: 24px;
  font-weight: bold;
}

/* MIDDLE SECTION — ROW FLEXBOX */
.content {
  flex: 1;                    /* pushes footer to bottom */
  display: flex;
  min-height: 0;
}

/* MAIN */
.main {
  flex: 1;                    /* fills remaining space */
  background: #4caf6e;
  padding: 25px;
  color: white;
  overflow-y: auto;
}

/* GRID OF ITEMS USING FLEX WRAP */
.items {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;                  /* spacing between items */
}

.item {
  background: #2f7a50;
  padding: 25px;
  font-weight: bold;
  color: white;
  border-radius: 10px;
  width: calc(25% - 20px);    /* 4 per row */
  text-align: center;
}

/* SIDEBAR */
.sidebar {
  width: 300px;
  background: #f15d4a;
  padding: 30px;
  color: white;
  font-size: 22px;
  font-weight: bold;
}

/* FOOTER */
.footer {
  background: #3e6eea;
  padding: 30px;
  color: white;
  font-size: 22px;
  font-weight: bold;
}

/* RESPONSIVE */
@media (max-width: 900px) {
  .content {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
  }

  .item {
    width: calc(50% - 20px);
  }
}

@media (max-width: 500px) {
  .item {
    width: 100%;
  }
}
