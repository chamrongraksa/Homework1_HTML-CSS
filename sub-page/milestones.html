<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburger Transition Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    /* Header */
    header {
      background: #111;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    /* Hamburger */
    .menu-icon {
      font-size: 28px;
      cursor: pointer;
      display: none;
    }

    /* Hidden checkbox */
    #menu-toggle {
      display: none;
    }

    /* Menu */
    nav {
      background: #222;
    }

    .menu {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .menu li a {
      color: white;
      text-decoration: none;
    }

    /* Mobile menu (hidden by default) */
    @media (max-width: 768px) {
      .menu-icon {
        display: block;
      }

      .menu {
        flex-direction: column;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: max-height 0.4s ease, opacity 0.4s ease;
      }

      /* When hamburger is clicked */
      #menu-toggle:checked ~ nav .menu {
        max-height: 300px;
        opacity: 1;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">MyLogo</div>

  <!-- Hidden checkbox -->
  <input type="checkbox" id="menu-toggle">

  <!-- Hamburger icon -->
  <label for="menu-toggle" class="menu-icon">☰</label>
</header>

<nav>
  <ul class="menu">
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

</body>
</html>
