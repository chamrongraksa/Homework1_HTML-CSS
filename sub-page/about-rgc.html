<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack Elements Demo</title>

  <style>
    body {
  background: #f0f0f0;
  padding: 40px;
  font-family: Arial, sans-serif;
}

/* Parent wrapper */
.container {
  position: relative;
  width: 600px;
  margin: auto;
}

/* Background image */
.container img {
  width: 100%;
  display: block;
}

/* Text overlay */
.overlay-text {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 32px;
  color: white;
  background: rgba(0, 0, 0, 0.3); /* semi-transparent layer */
}

  </style>
</head>
<body>

<div class="container">
  <img src="https://via.placeholder.com/600x300" alt="Demo Image">
  <div class="overlay-text">Hello, I'm on top!</div>
</div>

</body>
</html>
